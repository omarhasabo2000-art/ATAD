<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عتاد للتوريدات - معرض التغليف المخصص</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #c5a059;
            --primary-dark: #a88746;
            --secondary-color: #1a1a1a;
            --dark-gray: #222222;
            --light-gray: #111111;
            --border-color: #333333;
            --white: #ffffff;
            --transition: all 0.3s ease-in-out;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--light-gray); color: var(--white); line-height: 1.8; overflow-x: hidden; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }

        /* الهيدر */
        header { background: var(--secondary-color); padding: 15px 0; position: fixed; width: 100%; top: 0; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: var(--transition); border-bottom: 1px solid var(--border-color); }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo-img { height: 50px; width: auto; display: block; transition: var(--transition); }
        .logo-img:hover { opacity: 0.9; transform: scale(1.02); }
        nav ul { list-style: none; display: flex; gap: 25px; align-items: center; }
        nav ul li a { text-decoration: none; color: var(--white); font-weight: 700; font-size: 15px; transition: var(--transition); }
        nav ul li a:hover { color: var(--primary-color); }
        .nav-btn { background: var(--primary-color); color: var(--white) !important; padding: 10px 20px; border-radius: 8px; }
        .nav-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }

        /* رأس الصفحة */
        .page-header { background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('wrapping/cover.jpg') center/cover no-repeat; padding: 160px 0 80px; text-align: center; color: var(--white); border-bottom: 1px solid var(--border-color); }
        .page-header h1 { font-size: 42px; font-weight: 900; margin-bottom: 15px; color: var(--primary-color); }
        .page-header p { font-size: 18px; color: #ccc; max-width: 600px; margin: 0 auto; }

        /* شبكة المعرض */
        .gallery-container { padding: 80px 0; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        
        .gallery-card { background: var(--secondary-color); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: var(--transition); display: flex; flex-direction: column; justify-content: space-between; }
        .gallery-card:hover { transform: translateY(-8px); border-color: var(--primary-color); box-shadow: 0 15px 35px rgba(197,160,89,0.15); }
        
        .gallery-img-wrap { width: 100%; height: 280px; overflow: hidden; background: #000; position: relative; }
        .gallery-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .gallery-card:hover .gallery-img-wrap img { transform: scale(1.08); }
        
        .gallery-body { padding: 25px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .gallery-body h3 { font-size: 18px; font-weight: 800; color: var(--white); margin-bottom: 20px; }
        
        .order-btn { background: var(--primary-color); color: var(--secondary-color); text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; font-size: 15px; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .order-btn:hover { background: var(--white); color: var(--secondary-color); }

        /* الفوتر */
        footer { background: #0a0a0a; color: #777; padding: 60px 0 20px; text-align: center; border-top: 1px solid var(--border-color); }
        .footer-logo-img { height: 45px; width: auto; margin-bottom: 15px; filter: brightness(0) invert(1); display: inline-block; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="container">
            <a href="index.html">
                <img src="logo.png" alt="ATAD Logo" class="logo-img">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html#home">الرئيسية</a></li>
                    <li><a href="index.html#services">أقسامنا</a></li>
                    <li><a href="index.html#portfolio">سابقة الأعمال</a></li>
                    <li><a href="lighting.html">معرض الإضاءة</a></li>
                    <li><a href="tawabin.html">مطعم طوابين</a></li>
                    <li><a href="index.html#export">خدمات التصدير</a></li>
                    <li><a href="https://wa.me/201012345678" target="_blank" class="nav-btn"><i class="fa-brands fa-whatsapp"></i> اطلب استشارة</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- رأس الصفحة -->
    <section class="page-header">
        <div class="container">
            <h1>معرض التغليف المخصص</h1>
            <p>تشكيلة احترافية من الشنط، العبوات، والبوكسات المطبوعة بشعارك لتعزيز هويتك التجارية.</p>
        </div>
    </section>

    <!-- قسم المعرض (يتم توليد الـ 35 صورة تلقائياً هنا) -->
    <section class="gallery-container">
        <div class="container">
            <div class="gallery-grid" id="wrapping-grid">
                <!-- الـ 35 صورة هتتولد هنا أوتوماتيك -->
            </div>
        </div>
    </section>

    <!-- الفوتر -->
    <footer>
        <div class="container">
            <a href="index.html">
                <img src="logo.png" alt="ATAD Logo" class="footer-logo-img">
            </a>
            <p>جميع الحقوق محفوظة © 2026 لمؤسسة عتاد للتوريدات.</p>
        </div>
    </footer>

    <script>
        // كود توليد الـ 35 صورة تلقائياً بنفس نمط معرض الإضاءة وزرار الواتساب
        const gridContainer = document.getElementById('wrapping-grid');
        let contentHTML = '';

        for (let i = 1; i <= 35; i++) {
            let whatsappText = encodeURIComponent(`مرحباً، أرغب في الاستفسار أو طلب هذا المنتج: نموذج تغليف رقم ${i}`);
            contentHTML += `
                <div class="gallery-card">
                    <div class="gallery-img-wrap">
                        <img src="wrapping/wrap (${i}).jpeg" alt="نموذج تغليف ${i}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1543168256-418811576931?w=500&q=80'">
                    </div>
                    <div class="gallery-body">
                        <h3>نموذج تغليف رقم ${i}</h3>
                        <a href="https://wa.me/201012345678?text=${whatsappText}" target="_blank" class="order-btn">
                            <i class="fa-brands fa-whatsapp"></i> اطلب هذا المنتج
                        </a>
                    </div>
                </div>
            `;
        }

        gridContainer.innerHTML = contentHTML;
    </script>
</body>
</html>
